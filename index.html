<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Supplier Scorecard | Premium Design</title>
    
    <!-- Fonts: Inter for that clean, modern UI look -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">

    <style>
        /* --- DESIGN SYSTEM & TOKENS --- */
        :root {
            /* Color Palette - Slate Scale (Neutral/Cool) */
            --bg-app: #F1F5F9;        /* Slate 100 */
            --bg-surface: #FFFFFF;
            --bg-surface-alt: #F8FAFC; /* Slate 50 */
            
            --text-primary: #0F172A;   /* Slate 900 */
            --text-secondary: #64748B; /* Slate 500 */
            --text-tertiary: #94A3B8;  /* Slate 400 */
            
            --border-subtle: #E2E8F0;  /* Slate 200 */
            --border-focus: #CBD5E1;   /* Slate 300 */

            /* Brand Colors - Refined Indigo */
            --primary: #4F46E5;        /* Indigo 600 */
            --primary-hover: #4338CA;  /* Indigo 700 */
            --primary-light: #EEF2FF;  /* Indigo 50 */
            
            /* Semantic Colors */
            --success-bg: #DCFCE7; --success-text: #15803d;
            --warning-bg: #FEF3C7; --warning-text: #b45309;
            --danger-bg: #FEE2E2;  --danger-text: #b91c1c;
            --info-bg: #E0F2FE;    --info-text: #075985;

            /* Spacing & Layout */
            --radius-sm: 6px;
            --radius-md: 8px;
            --radius-lg: 12px;
            --radius-xl: 16px;
            
            /* Shadows (Elevation) */
            --shadow-sm: 0 1px 2px 0 rgb(0 0 0 / 0.05);
            --shadow-md: 0 4px 6px -1px rgb(0 0 0 / 0.1), 0 2px 4px -2px rgb(0 0 0 / 0.1);
            --shadow-lg: 0 10px 15px -3px rgb(0 0 0 / 0.1), 0 4px 6px -4px rgb(0 0 0 / 0.1);
            --shadow-float: 0 20px 25px -5px rgb(0 0 0 / 0.1), 0 8px 10px -6px rgb(0 0 0 / 0.1);

            --font-family: 'Inter', sans-serif;
        }

        /* --- NAV COMPONENT STYLES --- */
        .month-nav-wrapper {
            background: white;
            border-radius: var(--radius-lg);
            border: 1px solid var(--border-subtle);
            padding: 8px 12px;
            display: flex;
            align-items: center;
            gap: 16px;
            margin-bottom: 24px;
            box-shadow: var(--shadow-sm);
        }
        .month-track {
            display: flex;
            flex: 1;
            justify-content: space-between;
            gap: 4px;
            overflow-x: auto;
        }
        .month-tile {
            padding: 8px 0;
            flex: 1;
            text-align: center;
            border-radius: var(--radius-md);
            font-size: 0.875rem;
            font-weight: 500;
            color: var(--text-secondary);
            cursor: pointer;
            transition: all 0.2s;
            min-width: 45px;
            border: 1px solid transparent;
        }
        .month-tile:hover {
            background-color: var(--bg-app);
            color: var(--primary);
        }
        .month-tile.active {
            background-color: var(--primary);
            color: white;
            box-shadow: var(--shadow-sm);
            font-weight: 600;
        }
        .nav-arrow {
            width: 32px;
            height: 32px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 50%;
            cursor: pointer;
            color: var(--text-secondary);
            transition: all 0.2s;
        }
        .nav-arrow:hover {
            background-color: var(--bg-app);
            color: var(--primary);
        }
        .year-select {
            font-size: 0.875rem;
            font-weight: 700;
            color: var(--text-primary);
            padding: 6px 12px;
            background: var(--bg-app);
            border: 1px solid transparent;
            border-radius: var(--radius-md);
            cursor: pointer;
            outline: none;
            transition: all 0.2s;
            font-family: var(--font-family);
        }
        .year-select:hover {
            background-color: #e2e8f0;
        }
        .year-select:focus {
            border-color: var(--primary);
            background-color: white;
        }

        /* --- REPORT SPECIFIC STYLES --- */
        .report-controls {
            display: flex;
            gap: 12px;
            align-items: center;
            background: var(--bg-surface);
            padding: 12px 20px;
            border-radius: var(--radius-lg);
            border: 1px solid var(--border-subtle);
            margin-bottom: 24px;
            box-shadow: var(--shadow-sm);
        }
        
        .hero-score-card {
            background: white;
            border-radius: var(--radius-xl);
            padding: 32px;
            border: 1px solid var(--border-subtle);
            box-shadow: var(--shadow-md);
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 24px;
            position: relative;
            overflow: hidden;
        }
        .hero-score-card::after {
            content: '';
            position: absolute;
            right: 0; top: 0; bottom: 0;
            width: 6px;
            background: currentColor; /* Dynamic color */
        }

        .score-pill {
            padding: 4px 12px;
            border-radius: 99px;
            font-size: 0.75rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            display: inline-block;
        }
        .score-pill.good { background: var(--success-bg); color: var(--success-text); }
        .score-pill.avg { background: var(--warning-bg); color: var(--warning-text); }
        .score-pill.bad { background: var(--danger-bg); color: var(--danger-text); }

        .group-header-row td {
            background-color: var(--bg-surface-alt);
            font-weight: 600;
            color: var(--text-primary);
            padding: 16px 24px;
            border-top: 1px solid var(--border-subtle);
            border-bottom: 1px solid var(--border-subtle);
        }
        .kpi-row td {
            padding: 12px 24px;
            border-bottom: 1px solid var(--border-subtle);
            color: var(--text-secondary);
            font-size: 0.875rem;
        }
        .kpi-row:hover td {
            background-color: #F8FAFC;
        }
        .kpi-indent { padding-left: 48px !important; position: relative; }
        .kpi-indent::before {
            content: '';
            position: absolute;
            left: 24px; top: 0; bottom: 50%;
            width: 1px;
            background: var(--border-subtle);
        }
        .kpi-indent::after {
            content: '';
            position: absolute;
            left: 24px; top: 50%;
            width: 12px;
            height: 1px;
            background: var(--border-subtle);
        }

        .progress-bar {
            height: 6px;
            border-radius: 3px;
            background: var(--border-subtle);
            overflow: hidden;
            width: 80px;
            display: inline-block;
            vertical-align: middle;
            margin-right: 8px;
        }
        .progress-fill { height: 100%; border-radius: 3px; transition: width 0.5s ease; }
        
        /* --- RESET & BASE --- */
        * { box-sizing: border-box; outline: none; }
        
        body {
            font-family: var(--font-family);
            background-color: var(--bg-app);
            color: var(--text-primary);
            margin: 0;
            height: 100vh;
            display: flex;
            flex-direction: column;
            -webkit-font-smoothing: antialiased;
        }

        /* Scrollbar Polish */
        ::-webkit-scrollbar { width: 8px; height: 8px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: #CBD5E1; border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: #94A3B8; }

        /* --- TYPOGRAPHY --- */
        h1, h2, h3 { margin: 0; font-weight: 600; letter-spacing: -0.025em; }
        .text-sm { font-size: 0.875rem; }
        .text-xs { font-size: 0.75rem; }
        .font-medium { font-weight: 500; }
        .text-secondary { color: var(--text-secondary); }

        /* --- COMPONENTS --- */
        .btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            padding: 8px 16px;
            border-radius: var(--radius-md);
            font-size: 0.875rem;
            font-weight: 500;
            transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
            cursor: pointer;
            border: 1px solid transparent;
        }
        .btn-primary { background-color: var(--primary); color: white; box-shadow: 0 1px 2px rgba(0,0,0,0.1); }
        .btn-primary:hover { background-color: var(--primary-hover); transform: translateY(-1px); }
        .btn-secondary { background-color: white; border-color: var(--border-subtle); color: var(--text-primary); box-shadow: var(--shadow-sm); }
        .btn-secondary:hover { background-color: var(--bg-surface-alt); border-color: var(--border-focus); }
        .btn-ghost { background-color: transparent; color: var(--text-secondary); }
        .btn-ghost:hover { background-color: var(--bg-app); color: var(--text-primary); }
        .btn-icon { padding: 8px; border-radius: var(--radius-md); color: var(--text-secondary); cursor: pointer; transition: all 0.2s; }
        .btn-icon:hover { background-color: var(--bg-app); color: var(--primary); }

        .badge { display: inline-flex; align-items: center; padding: 2px 10px; border-radius: 9999px; font-size: 0.75rem; font-weight: 600; letter-spacing: 0.025em; }
        .badge-active { background-color: var(--success-bg); color: var(--success-text); }
        .badge-inactive { background-color: var(--danger-bg); color: var(--danger-text); }
        .badge-neutral { background-color: var(--bg-app); color: var(--text-secondary); border: 1px solid var(--border-subtle); }

        .card {
            background: var(--bg-surface);
            border-radius: var(--radius-xl);
            box-shadow: var(--shadow-sm);
            border: 1px solid var(--border-subtle);
            overflow: hidden;
        }

        .input-clean {
            background: var(--bg-surface-alt);
            border: 1px solid var(--border-subtle);
            border-radius: var(--radius-md);
            padding: 6px 10px;
            font-size: 0.875rem;
            width: 100%;
            transition: all 0.2s;
            color: var(--text-primary);
        }
        .input-clean:focus { background: white; border-color: var(--primary); box-shadow: 0 0 0 3px var(--primary-light); }

        .switch { position: relative; display: inline-block; width: 36px; height: 20px; }
        .switch input { opacity: 0; width: 0; height: 0; }
        .slider { position: absolute; cursor: pointer; top: 0; left: 0; right: 0; bottom: 0; background-color: #cbd5e1; transition: .3s; border-radius: 20px; }
        .slider:before { position: absolute; content: ""; height: 16px; width: 16px; left: 2px; bottom: 2px; background-color: white; transition: .3s; border-radius: 50%; box-shadow: 0 1px 2px rgba(0,0,0,0.2); }
        input:checked + .slider { background-color: var(--primary); }
        input:checked + .slider:before { transform: translateX(16px); }

        /* --- LAYOUT & HEADER --- */
        header {
            background: rgba(255, 255, 255, 0.9);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border-bottom: 1px solid var(--border-subtle);
            padding: 12px 32px;
            position: sticky;
            top: 0;
            z-index: 50;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .brand { display: flex; align-items: center; gap: 12px; }
        .brand-icon {
            width: 36px; height: 36px;
            background: linear-gradient(135deg, var(--primary) 0%, #818cf8 100%);
            border-radius: 10px;
            display: flex; align-items: center; justify-content: center;
            color: white;
            box-shadow: 0 2px 4px rgba(79, 70, 229, 0.3);
        }

        .user-profile { display: flex; align-items: center; gap: 12px; padding-left: 24px; border-left: 1px solid var(--border-subtle); }
        .avatar { width: 32px; height: 32px; background: #E0E7FF; color: var(--primary); border-radius: 50%; display: flex; align-items: center; justify-content: center; font-weight: 600; font-size: 0.875rem; }

        .main-container { max-width: 1440px; margin: 0 auto; width: 100%; padding: 32px; flex: 1; overflow-y: auto; }
        .table-container { overflow-x: auto; }
        table { width: 100%; border-collapse: separate; border-spacing: 0; }
        thead th { background-color: var(--bg-surface-alt); color: var(--text-secondary); font-size: 0.75rem; text-transform: uppercase; letter-spacing: 0.05em; padding: 12px 24px; text-align: left; border-bottom: 1px solid var(--border-subtle); font-weight: 600; }
        tbody td { padding: 16px 24px; border-bottom: 1px solid var(--border-subtle); font-size: 0.875rem; color: var(--text-primary); vertical-align: middle; transition: background 0.1s; }
        tbody tr:last-child td { border-bottom: none; }
        
        .popover { position: absolute; background: white; border-radius: var(--radius-lg); box-shadow: var(--shadow-lg); border: 1px solid var(--border-subtle); min-width: 200px; z-index: 100; opacity: 0; transform: translateY(10px) scale(0.98); pointer-events: none; transition: all 0.15s cubic-bezier(0.16, 1, 0.3, 1); }
        .popover.active { opacity: 1; transform: translateY(0) scale(1); pointer-events: auto; }
        .popover-item { padding: 10px 16px; display: flex; align-items: center; gap: 10px; font-size: 0.875rem; color: var(--text-primary); cursor: pointer; transition: background 0.1s; }
        .popover-item:hover { background: var(--bg-surface-alt); }
        .popover-item i { width: 16px; color: var(--text-secondary); }

        .stats-ribbon { display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 16px; margin-bottom: 24px; }
        .stat-card { background: white; padding: 16px; border-radius: var(--radius-lg); border: 1px solid var(--border-subtle); box-shadow: var(--shadow-sm); }
        .stat-label { font-size: 0.75rem; color: var(--text-secondary); text-transform: uppercase; letter-spacing: 0.05em; margin-bottom: 4px; }
        .stat-value { font-size: 1rem; font-weight: 600; color: var(--text-primary); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

        .cell-input input { text-align: right; font-family: 'Inter', monospace; font-variant-numeric: tabular-nums; font-weight: 500; }
        
        .toast { position: fixed; bottom: 32px; left: 50%; transform: translateX(-50%) translateY(20px); background: #1e293b; color: white; padding: 12px 24px; border-radius: 99px; font-size: 0.875rem; font-weight: 500; box-shadow: var(--shadow-lg); opacity: 0; pointer-events: none; transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1); display: flex; align-items: center; gap: 8px; z-index: 2000; }
        .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

        .fab { position: fixed; bottom: 32px; right: 32px; width: 56px; height: 56px; background: var(--primary); color: white; border-radius: 20px; display: flex; align-items: center; justify-content: center; font-size: 1.25rem; box-shadow: var(--shadow-float); cursor: pointer; transition: all 0.3s; z-index: 1000; }
        .fab:hover { transform: scale(1.05) rotate(90deg); background: var(--primary-hover); }

        /* --- TREND CHART STYLES (New) --- */
        .trend-grid { display: grid; grid-template-columns: repeat(12, 1fr); gap: 8px; height: 180px; align-items: end; padding-top: 20px; }
        .trend-col { display: flex; flex-direction: column; align-items: center; gap: 8px; height: 100%; justify-content: flex-end; cursor: pointer; transition: transform 0.2s; }
        .trend-col:hover { transform: translateY(-4px); }
        .trend-bar-bg { width: 100%; height: 100px; background: var(--bg-surface-alt); border-radius: 6px; position: relative; overflow: hidden; }
        .trend-bar-fill { position: absolute; bottom: 0; left: 0; right: 0; background: #cbd5e1; transition: height 0.5s ease; border-radius: 0 0 6px 6px; }
        .trend-val { font-size: 0.7rem; font-weight: 600; color: var(--text-primary); opacity: 0; transition: opacity 0.2s; }
        .trend-col:hover .trend-val, .trend-col.active .trend-val { opacity: 1; }
        .trend-lbl { font-size: 0.7rem; color: var(--text-secondary); text-transform: uppercase; font-weight: 500; }
        
        /* Active State (Current Month) */
        .trend-col.active .trend-bar-fill { background: var(--primary); }
        .trend-col.active .trend-lbl { color: var(--primary); font-weight: 700; }
        .trend-col.active .trend-bar-bg { box-shadow: 0 0 0 2px var(--primary-light); }

    </style>
</head>
<body>

    <!-- HEADER -->
    <header>
        <div class="brand">
            <div class="brand-icon">
                <i class="fa-solid fa-layer-group"></i>
            </div>
            <div>
                <h2 class="text-sm font-medium" style="margin-bottom: 2px;">Supplier Scorecard</h2>
                <div class="text-xs text-secondary">Enterprise v2.0</div>
            </div>
        </div>
        
        <div style="display: flex; align-items: center; gap: 24px;">
            <div class="text-sm text-secondary cursor-pointer hover:text-primary"><i class="fa-regular fa-bell"></i></div>
            <div class="text-sm text-secondary cursor-pointer hover:text-primary"><i class="fa-regular fa-circle-question"></i></div>
            <div class="user-profile">
                <div style="text-align: right;">
                    <div class="text-sm font-medium">Jane Admin</div>
                    <div class="text-xs text-secondary">Headquarters</div>
                </div>
                <div class="avatar">JA</div>
            </div>
        </div>
    </header>

    <!-- MAIN CONTAINER -->
    <div id="main-content" class="main-container">
        <!-- Dynamic Content Injected Here -->
    </div>

    <!-- TOAST -->
    <div id="toast" class="toast">
        <i class="fa-solid fa-circle-check" style="color: #4ade80;"></i>
        <span id="toast-msg">Success</span>
    </div>

    <!-- FAB -->
    <div class="fab" onclick="App.showToast('Opening Help Center...')" title="Quick Actions">
        <i class="fa-solid fa-plus"></i>
    </div>

    <script>
        // --- DATA STORE ---
        const store = {
            suppliers: [
                { id: 1, name: 'SagarSupplier', code: 'SUP001', template: 'ConMet Standard', plant: 'Chitradurga', location: 'India', date: 'Nov 20, 2025', freq: 'Monthly', status: 'Active' },
                { id: 2, name: 'Acme Logistics', code: 'SUP002', template: 'Logistics v1', plant: 'Pune', location: 'India', date: 'Nov 21, 2025', freq: 'Weekly', status: 'Active' },
                { id: 3, name: 'Global Steel', code: 'SUP003', template: 'Raw Material', plant: 'Ohio', location: 'USA', date: 'Oct 15, 2025', freq: 'Monthly', status: 'Inactive' },
                { id: 4, name: 'TechParts Inc', code: 'SUP004', template: 'Electronics', plant: 'Shenzhen', location: 'China', date: 'Nov 01, 2025', freq: 'Quarterly', status: 'Active' }
            ],
            // Updated Data Model with Targets and Scoring Logic (REQ-004, REQ-007)
            elements: [
                // Quality Group
                { id: 'e1', code: 'Q-1', group: 'Quality Performance', name: 'Total Receipts', uom: 'Qty', type: 'input', target: null, weight: 0 },
                { id: 'e2', code: 'Q-2', group: 'Quality Performance', name: 'Rejected Qty', uom: 'Qty', type: 'input', target: 0, weight: 0 },
                { id: 'e3', code: 'Q-3', group: 'Quality Performance', name: 'Rejection %', uom: '%', type: 'calc', formula: '(Q-2 / Q-1) * 100', target: 1.0, weight: 60, direction: 'lower_better' },
                
                // Delivery Group
                { id: 'e4', code: 'D-1', group: 'Delivery Performance', name: 'Planned Deliveries', uom: 'Count', type: 'input', target: null, weight: 0 },
                { id: 'e5', code: 'D-2', group: 'Delivery Performance', name: 'On-Time Deliveries', uom: 'Count', type: 'input', target: null, weight: 0 },
                { id: 'e6', code: 'D-3', group: 'Delivery Performance', name: 'Delivery Compliance', uom: '%', type: 'calc', formula: '(D-2 / D-1) * 100', target: 98.0, weight: 40, direction: 'higher_better' }
            ],
            entries: {
                1: { 'e1': 1000, 'e2': 5, 'e3': 0.5, 'e4': 20, 'e5': 18, 'e6': 90, 'e7': 0 }
            },
            context: {
                year: 2025,
                month: 10 // 0-indexed, 10 = Nov
            },
            currentUser: 'Admin',
            selectedSupplierId: null
        };

        // --- APPLICATION LOGIC ---
        const App = {
            init() {
                this.renderDashboard();
                document.addEventListener('click', (e) => {
                    if (!e.target.closest('.action-trigger')) {
                        document.querySelectorAll('.popover').forEach(el => el.classList.remove('active'));
                    }
                });
            },

            showToast(msg) {
                const toast = document.getElementById('toast');
                document.getElementById('toast-msg').innerText = msg;
                toast.classList.add('show');
                setTimeout(() => toast.classList.remove('show'), 3000);
            },

            // --- DASHBOARD ---
            renderDashboard() {
                const container = document.getElementById('main-content');
                let html = `
                    <div style="margin-bottom: 32px; display: flex; justify-content: space-between; align-items: flex-end;">
                        <div>
                            <h1 class="text-lg font-medium" style="font-size: 1.5rem;">Dashboard</h1>
                            <div class="text-secondary text-sm" style="margin-top: 4px;">Overview of supplier performance scorecards</div>
                        </div>
                        <div style="display: flex; gap: 12px;">
                            <button class="btn btn-secondary" onclick="App.showToast('Exporting CSV...')"><i class="fa-solid fa-download"></i> Export</button>
                            <button class="btn btn-primary" onclick="App.showToast('New Scorecard Wizard')"><i class="fa-solid fa-plus"></i> New Scorecard</button>
                        </div>
                    </div>
                    <div class="card">
                        <div style="padding: 16px 24px; border-bottom: 1px solid var(--border-subtle); display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 16px;">
                            <div style="display: flex; gap: 12px; align-items: center; flex: 1;">
                                <div style="position: relative; max-width: 300px; width: 100%;">
                                    <i class="fa-solid fa-magnifying-glass" style="position: absolute; left: 10px; top: 50%; transform: translateY(-50%); color: var(--text-tertiary);"></i>
                                    <input type="text" class="input-clean" style="padding-left: 32px;" placeholder="Search suppliers..." onkeyup="App.filterDashboard(this.value)">
                                </div>
                            </div>
                        </div>
                        <div class="table-container">
                            <table id="dashboardTable">
                                <thead>
                                    <tr>
                                        <th style="width: 40px;"></th>
                                        <th>Supplier</th>
                                        <th>Code</th>
                                        <th>Template</th>
                                        <th>Plant</th>
                                        <th>Target Date</th>
                                        <th>Status</th>
                                    </tr>
                                </thead>
                                <tbody>${this.generateDashboardRows()}</tbody>
                            </table>
                        </div>
                    </div>
                `;
                container.innerHTML = html;
            },

            generateDashboardRows() {
                return store.suppliers.map(s => `
                    <tr class="data-row">
                        <td style="position: relative;">
                            <button class="btn-icon action-trigger" onclick="App.toggleMenu(event, ${s.id})"><i class="fa-solid fa-ellipsis"></i></button>
                            <div class="popover" id="menu-${s.id}" style="top: 40px; left: 10px;">
                                <div class="popover-item" onclick="App.renderEntry(${s.id})"><i class="fa-regular fa-pen-to-square"></i> Enter Data</div>
                                <div class="popover-item" onclick="App.renderReport(${s.id})"><i class="fa-regular fa-file-lines"></i> View Report</div>
                            </div>
                        </td>
                        <td class="font-medium text-primary">${s.name}</td>
                        <td class="text-secondary text-sm"><span style="font-family: monospace; background: var(--bg-app); padding: 2px 6px; border-radius: 4px;">${s.code}</span></td>
                        <td>${s.template}</td>
                        <td>${s.plant}</td>
                        <td class="text-secondary">${s.date}</td>
                        <td><span class="badge ${s.status === 'Active' ? 'badge-active' : 'badge-inactive'}">${s.status}</span></td>
                    </tr>
                `).join('');
            },

            toggleMenu(e, id) {
                e.stopPropagation();
                document.querySelectorAll('.popover').forEach(p => p.classList.remove('active'));
                const menu = document.getElementById(`menu-${id}`);
                if (menu) menu.classList.add('active');
            },

            filterDashboard(val = '') {
                const input = val.toLowerCase();
                document.querySelectorAll('.data-row').forEach(row => {
                    row.style.display = row.innerText.toLowerCase().includes(input) ? 'table-row' : 'none';
                });
            },

            // --- ENTRY SCREEN (Shared Context with Report) ---
            renderEntry(supplierId) {
                store.selectedSupplierId = supplierId;
                const s = store.suppliers.find(x => x.id === supplierId);
                const container = document.getElementById('main-content');
                const months = ["Jan", "Feb", "Mar", "Apr", "May", "Jun", "Jul", "Aug", "Sep", "Oct", "Nov", "Dec"];
                let yearOptions = '';
                for(let y=2020; y<=2030; y++) yearOptions += `<option value="${y}" ${y===store.context.year?'selected':''}>${y}</option>`;

                let html = `
                    <div style="display: flex; gap: 8px; align-items: center; font-size: 0.875rem; color: var(--text-secondary); margin-bottom: 24px;">
                        <span class="cursor-pointer hover:text-primary" onclick="App.renderDashboard()">Dashboard</span>
                        <i class="fa-solid fa-chevron-right" style="font-size: 10px;"></i>
                        <span class="text-primary font-medium">Data Entry: ${s.name}</span>
                    </div>
                    <div class="month-nav-wrapper">
                        <select class="year-select" onchange="App.setYear(this.value)">${yearOptions}</select>
                        <div class="nav-arrow" onclick="App.changeMonth(-1)"><i class="fa-solid fa-chevron-left"></i></div>
                        <div class="month-track">
                            ${months.map((m, idx) => `<div class="month-tile ${idx===store.context.month?'active':''}" onclick="App.setMonth(${idx})">${m}</div>`).join('')}
                        </div>
                        <div class="nav-arrow" onclick="App.changeMonth(1)"><i class="fa-solid fa-chevron-right"></i></div>
                    </div>
                    <div class="card">
                        <div style="padding: 16px 24px; border-bottom: 1px solid var(--border-subtle); display: flex; justify-content: space-between; align-items: center;">
                            <h3 class="font-medium">Input Data</h3>
                            <button class="btn btn-primary" onclick="App.showToast('Saved')">Save Changes</button>
                        </div>
                        <div class="table-container">
                            <table>
                                <thead><tr><th style="width:60px;">No.</th><th>Code</th><th>Element</th><th>UOM</th><th style="text-align:right;">Value</th></tr></thead>
                                <tbody>
                                    ${store.elements.map((el,i) => {
                                        const val = (store.entries[supplierId]||{})[el.id] ?? '';
                                        return `<tr><td class="text-secondary text-xs">${i+1}</td><td class="text-secondary text-xs font-medium">${el.code}</td><td class="font-medium text-primary">${el.name}</td><td><span class="badge badge-neutral">${el.uom}</span></td><td style="text-align:right;">${el.type==='input' ? `<div class="cell-input"><input type="number" class="input-clean" value="${val}" onblur="App.handleInputBlur('${el.id}', this.value)"></div>` : `<div class="font-medium" id="calc-${el.id}">${val}</div>`}</td></tr>`
                                    }).join('')}
                                </tbody>
                            </table>
                        </div>
                    </div>
                `;
                container.innerHTML = html;
            },

            // --- REPORT SCREEN (Redesigned based on SDD) ---
            renderReport(supplierId) {
                store.selectedSupplierId = supplierId;
                const s = store.suppliers.find(x => x.id === supplierId);
                const entries = store.entries[supplierId] || {};
                const months = ["January", "February", "March", "April", "May", "June", "July", "August", "September", "October", "November", "December"];
                
                // 1. Calculate Scores (REQ-005, REQ-006)
                const calculation = this.calculateScorecard(s.id);
                const overallScore = calculation.overallScore.toFixed(2);
                
                // Threshold Logic (REQ-008, REQ-010)
                let overallColor = 'var(--primary)';
                let overallPillClass = 'good';
                let heroTextClass = 'text-green-600';
                
                if (overallScore < 90) { overallColor = '#EAB308'; overallPillClass = 'avg'; heroTextClass = 'text-yellow-600'; }
                if (overallScore < 80) { overallColor = '#DC2626'; overallPillClass = 'bad'; heroTextClass = 'text-red-600'; }

                const container = document.getElementById('main-content');
                
                // Year/Month Options (REQ-001, REQ-002)
                let yearOptions = '';
                for(let y=2020; y<=2030; y++) yearOptions += `<option value="${y}" ${y===store.context.year?'selected':''}>${y}</option>`;
                let monthOptions = months.map((m, i) => `<option value="${i}" ${i===store.context.month?'selected':''}>${m}</option>`).join('');

                let html = `
                    <div style="display: flex; gap: 8px; align-items: center; font-size: 0.875rem; color: var(--text-secondary); margin-bottom: 24px;">
                        <span class="cursor-pointer hover:text-primary" onclick="App.renderDashboard()">Dashboard</span>
                        <i class="fa-solid fa-chevron-right" style="font-size: 10px;"></i>
                        <span class="text-primary font-medium">Scorecard Report</span>
                    </div>

                    <!-- Period Selection (REQ-001) -->
                    <div class="report-controls">
                        <div class="text-sm font-medium text-secondary">Reporting Period:</div>
                        <select class="input-clean" style="width:auto;" onchange="App.setReportMonth(this.value)">${monthOptions}</select>
                        <select class="input-clean" style="width:auto;" onchange="App.setReportYear(this.value)">${yearOptions}</select>
                        <div style="flex:1;"></div>
                        <button class="btn btn-secondary" onclick="window.print()"><i class="fa-solid fa-print"></i> Print</button>
                        <button class="btn btn-primary" onclick="App.renderEntry(${s.id})">Edit Data</button>
                    </div>

                    <!-- Overall Score Hero (REQ-006, REQ-010) -->
                    <div class="hero-score-card" style="color: ${overallColor}">
                        <div>
                            <h1 style="font-size: 1.5rem; color: var(--text-primary); margin-bottom: 8px;">${s.name} <span class="text-secondary text-sm font-medium">(${s.code})</span></h1>
                            <div class="text-secondary text-sm">Overall Performance Score</div>
                            <div style="margin-top: 12px;"><span class="score-pill ${overallPillClass}">${overallScore >= 80 ? 'Meets Expectations' : 'Below Target'}</span></div>
                        </div>
                        <div style="text-align: right;">
                            <div style="font-size: 3.5rem; font-weight: 700; line-height: 1;">${overallScore}%</div>
                            <div class="text-secondary text-xs mt-1">Weighted Average</div>
                        </div>
                    </div>

                    <!-- Hierarchical Table (REQ-003, REQ-004) -->
                    <div class="card">
                        <div class="table-container">
                            <table>
                                <thead>
                                    <tr>
                                        <th style="padding-left:24px;">Metric Hierarchy</th>
                                        <th style="text-align:right;">Target</th>
                                        <th style="text-align:right;">Actual</th>
                                        <th style="text-align:right;">Score</th>
                                    </tr>
                                </thead>
                                <tbody>
                `;

                // Render Groups
                Object.keys(calculation.groups).forEach(groupName => {
                    const group = calculation.groups[groupName];
                    const groupScore = group.score.toFixed(2);
                    
                    // Group Header (REQ-009)
                    let groupColor = group.score >= 90 ? 'text-green-600' : (group.score >= 80 ? 'text-yellow-600' : 'text-red-600');
                    let barColor = group.score >= 90 ? 'var(--success-bg)' : (group.score >= 80 ? 'var(--warning-bg)' : 'var(--danger-bg)');
                    let fillClass = group.score >= 90 ? 'var(--success-text)' : (group.score >= 80 ? 'var(--warning-text)' : 'var(--danger-text)');

                    html += `
                        <tr class="group-header-row">
                            <td><i class="fa-solid fa-chevron-down" style="font-size:10px; margin-right:8px; color:var(--text-tertiary);"></i> ${groupName}</td>
                            <td></td>
                            <td></td>
                            <td style="text-align:right; color: ${fillClass}; font-weight:700;">
                                ${groupScore}%
                            </td>
                        </tr>
                    `;

                    // Render KPIs within Group (REQ-004)
                    group.kpis.forEach(kpi => {
                        const kpiVal = entries[kpi.id] || 0;
                        // Calculate individual KPI Score for display
                        let kpiScore = 0;
                        if(kpi.direction === 'lower_better') {
                             kpiScore = kpiVal <= kpi.target ? 100 : Math.max(0, 100 - (((kpiVal - kpi.target)/kpi.target)*100));
                        } else if (kpi.direction === 'higher_better') {
                             kpiScore = Math.min(100, (kpiVal / kpi.target) * 100);
                        }
                        
                        // Determine color for bar (REQ-008)
                        let kbarColor = kpiScore >= 90 ? '#22c55e' : (kpiScore >= 80 ? '#eab308' : '#ef4444');

                        html += `
                            <tr class="kpi-row">
                                <td class="kpi-indent">
                                    <div class="font-medium" style="color:var(--text-primary);">${kpi.name}</div>
                                    <div class="text-xs text-secondary">${kpi.code}</div>
                                </td>
                                <td style="text-align:right;">${kpi.target !== null ? kpi.target + ' ' + kpi.uom : '-'}</td>
                                <td style="text-align:right;">${kpiVal} ${kpi.uom}</td>
                                <td style="text-align:right;">
                                    ${kpi.target !== null ? 
                                        `<div class="progress-bar"><div class="progress-fill" style="width:${kpiScore}%; background:${kbarColor};"></div></div>
                                        <span style="font-weight:600; font-size:0.75rem;">${kpiScore.toFixed(0)}</span>` 
                                        : '<span class="text-secondary text-xs">N/A</span>'
                                    }
                                </td>
                            </tr>
                        `;
                    });
                });

                html += `</tbody></table></div></div>`;

                // --- NEW: MONTHLY SCORES TREND ---
                html += `
                    <div class="card" style="margin-top: 24px; padding: 24px;">
                        <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:16px;">
                            <h3 class="font-medium">Annual Performance Trend (${store.context.year})</h3>
                            <div class="text-xs text-secondary"><span style="display:inline-block; width:8px; height:8px; background:var(--primary); border-radius:50%; margin-right:4px;"></span>Selected Month</div>
                        </div>
                        <div class="trend-grid">
                            ${months.map((m, i) => {
                                // Logic: Use real score for current selected month. 
                                // For demo purposes, generate random realistic scores for others to show the visual.
                                let sc = (i === store.context.month) ? overallScore : (Math.floor(Math.random() * (98 - 75 + 1) + 75));
                                let isCurrent = i === store.context.month;
                                
                                return `
                                <div class="trend-col ${isCurrent ? 'active' : ''}" onclick="App.setReportMonth(${i})">
                                    <div class="trend-val">${sc}%</div>
                                    <div class="trend-bar-bg">
                                        <div class="trend-bar-fill" style="height: ${sc}%;"></div>
                                    </div>
                                    <div class="trend-lbl">${m.substring(0,3)}</div>
                                </div>
                                `;
                            }).join('')}
                        </div>
                    </div>
                `;

                container.innerHTML = html;
            },

            // Helper: Calculate Hierarchical Scores (REQ-005, REQ-006)
            calculateScorecard(supplierId) {
                const entries = store.entries[supplierId] || {};
                const groups = {};
                let totalWeightedScore = 0;
                let totalWeight = 0;

                // Group Elements
                store.elements.forEach(el => {
                    if (!groups[el.group]) groups[el.group] = { kpis: [], score: 0, weight: 0 };
                    groups[el.group].kpis.push(el);
                });

                // Calculate Group Scores
                Object.keys(groups).forEach(gName => {
                    const group = groups[gName];
                    let groupTotalScore = 0;
                    let groupDivisor = 0;

                    group.kpis.forEach(kpi => {
                        // Only score if it has a weight and target
                        if (kpi.weight > 0 && kpi.target !== null) {
                            const val = parseFloat(entries[kpi.id] || 0);
                            let score = 0;
                            
                            if (kpi.direction === 'lower_better') {
                                // E.g., Rejection: Target 1%. Actual 0.5% = 100 score. Actual 2% = 0 score logic
                                if (val <= kpi.target) score = 100;
                                else score = Math.max(0, 100 - (((val - kpi.target) / kpi.target) * 100)); // Simple linear penalty
                            } else {
                                // E.g., Delivery: Target 98%. Actual 90% = (90/98)*100
                                score = Math.min(100, (val / kpi.target) * 100);
                            }
                            
                            groupTotalScore += (score * kpi.weight); // Using weight as simple factor here
                            groupDivisor += kpi.weight;
                        }
                    });

                    // Group Score = Average of weighted KPIs (Simplified for prototype)
                    group.score = groupDivisor > 0 ? (groupTotalScore / groupDivisor) : 0;
                    
                    // Add to overall
                    // Assuming groups have implicit equal weight for now, or derived from KPI sums
                    totalWeightedScore += group.score; 
                    totalWeight++; 
                });

                return {
                    groups: groups,
                    overallScore: totalWeight > 0 ? (totalWeightedScore / totalWeight) : 0
                };
            },

            // Navigation & State Handlers
            changeMonth(dir) {
                let newM = store.context.month + dir;
                if(newM < 0) { store.context.month = 11; store.context.year--; }
                else if(newM > 11) { store.context.month = 0; store.context.year++; }
                else store.context.month = newM;
                this.renderEntry(store.selectedSupplierId);
            },
            setMonth(idx) { store.context.month = idx; this.renderEntry(store.selectedSupplierId); },
            setYear(y) { store.context.year = parseInt(y); this.renderEntry(store.selectedSupplierId); },
            
            // Report Specific Handlers (REQ-001)
            setReportMonth(val) { store.context.month = parseInt(val); this.renderReport(store.selectedSupplierId); },
            setReportYear(val) { store.context.year = parseInt(val); this.renderReport(store.selectedSupplierId); },

            handleInputBlur(id, val) {
                const sId = store.selectedSupplierId;
                if(!store.entries[sId]) store.entries[sId] = {};
                store.entries[sId][id] = parseFloat(val) || 0;
                this.recalculate(sId);
                this.showToast('Auto-saved');
            },

            recalculate(sId) {
                const entry = store.entries[sId];
                // Logic moved to store definition formula usage in real app, hardcoded here for proto
                if(entry['e1']) entry['e3'] = ((entry['e2']/entry['e1'])*100).toFixed(2);
                if(entry['e4']) entry['e6'] = ((entry['e5']/entry['e4'])*100).toFixed(2);
                if(document.getElementById('calc-e3')) document.getElementById('calc-e3').innerText = entry['e3'];
                if(document.getElementById('calc-e6')) document.getElementById('calc-e6').innerText = entry['e6'];
            }
        };

        window.onload = () => App.init();
    </script>
</body>
</html>
